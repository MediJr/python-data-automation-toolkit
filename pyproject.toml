[build-system]
requires = ["setuptools>=77"]  # 77+ is needed for the SPDX `license = "MIT"` field (PEP 639)
build-backend = "setuptools.build_meta"

[project]
name = "python-data-automation-toolkit"
version = "0.1.0"
description = "Declarative, validated and traceable automation of data-processing workflows (CSV/XLSX)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = ["defusedxml>=0.7.1,<1", "openpyxl>=3.1.5,<4", "pandas>=3.0.6,<4", "pydantic>=2.14,<3", "PyYAML>=6.0.3,<7"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[project.scripts]
data-automate = "data_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "E501"]  # test data (YAML, CSV) is clearer on one line
